<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#FFE14D">
<title>Трюфельная собака</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;900&family=Rubik:wght@500;700;800&display=swap">
<style>
  /* Стиль «Стикерпак» — выбран голосованием 28.09. Одна светлая тема намеренно: это фирменный жёлтый Стардогс */
  :root{--y:#FFE14D;--dot:#F2C300;--ink:#1E1A18;--red:#D8262D;--paper:#fff;--muted:#5B4B43;--truffle:#4A3326;--earth:#5A3B24;color-scheme:light}
  [hidden]{display:none!important}
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;background:var(--y);color:var(--ink)}
  body{font:500 16px/1.35 Rubik,system-ui,sans-serif;background-image:radial-gradient(var(--dot) 1.5px,transparent 1.6px);background-size:14px 14px;padding:16px 16px 32px;min-height:100vh}
  .wrap{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:14px;position:relative}
  /* наклейка «N нюхов» — над полем, справа; порядок блоков задан order, чтобы не переставлять разметку */
  .tag{order:1;align-self:flex-end;margin:-4px 4px -34px 0;position:relative;background:var(--paper);border:3px solid var(--ink);border-radius:999px;padding:5px 12px;font:800 14px Rubik,sans-serif;transform:rotate(8deg);box-shadow:3px 3px 0 var(--ink);z-index:4}
  .scene,.trail,#result,.test,footer{order:2}
  .eyebrow{font:800 13px Rubik,sans-serif;text-transform:uppercase;letter-spacing:.06em}
  .logo{margin:0;font:900 30px/1 Unbounded,sans-serif;text-transform:uppercase;letter-spacing:-.01em}
  .logo span{display:inline-block;background:var(--red);color:#fff;padding:3px 12px 5px;border-radius:12px;transform:rotate(-3deg);border:3px solid var(--ink);margin-top:6px;box-shadow:4px 4px 0 var(--ink)}
  .challenge{background:var(--red);color:#fff;border:3px solid var(--ink);border-radius:16px;padding:10px 14px;font:800 16px/1.3 Rubik,sans-serif;box-shadow:4px 4px 0 var(--ink);transform:rotate(-1.5deg)}
  .challenge small{display:block;font:600 13.5px/1.3 Rubik,sans-serif;opacity:.9;margin-top:2px}
  .hero{display:flex;align-items:flex-end;gap:10px}
  .dogbig{width:124px;flex:none;margin-bottom:-4px;filter:drop-shadow(3px 0 0 #fff) drop-shadow(-3px 0 0 #fff) drop-shadow(0 3px 0 #fff) drop-shadow(0 -3px 0 #fff) drop-shadow(3px 3px 0 var(--ink))}
  .bubble{flex:1;background:var(--paper);border:3px solid var(--ink);border-radius:18px 18px 18px 4px;padding:10px 14px;font:800 16px/1.3 Rubik,sans-serif;box-shadow:4px 4px 0 var(--ink)}
  .bubble small{display:block;font:500 14px/1.35 Rubik,sans-serif;color:var(--muted);margin-top:4px}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{background:var(--paper);border:2px solid var(--ink);border-radius:999px;padding:3px 9px;font:700 12.5px Rubik,sans-serif;color:var(--ink)}
  button.chip{cursor:pointer;margin-left:auto}
  .scene{display:flex;flex-direction:column}
  .sky{display:block;width:100%;height:auto;margin-bottom:-2px}
  .board{position:relative;display:grid;grid-template-columns:repeat(7,1fr);gap:5px;background:var(--earth);border:3px solid var(--ink);padding:7px;border-radius:0 0 18px 18px;box-shadow:5px 5px 0 var(--ink);touch-action:manipulation}
  .cell{appearance:none;border:2px solid rgba(30,26,24,.35);padding:0;aspect-ratio:1;border-radius:10px;font-size:18px;cursor:pointer;display:grid;place-items:center;transition:transform .12s,background .2s;color:var(--ink);
    background:radial-gradient(circle at 28% 32%,#E8893A 0 17%,transparent 18%),radial-gradient(circle at 70% 38%,#C9442F 0 14%,transparent 15%),radial-gradient(circle at 48% 72%,#9BA24A 0 16%,transparent 17%),#F4E6C0}
  .cell:nth-child(3n+1){background:radial-gradient(circle at 66% 30%,#E8893A 0 16%,transparent 17%),radial-gradient(circle at 30% 62%,#9BA24A 0 15%,transparent 16%),radial-gradient(circle at 72% 74%,#C9442F 0 13%,transparent 14%),#F4E6C0}
  .cell:nth-child(4n+2){background:radial-gradient(circle at 40% 36%,#C9442F 0 15%,transparent 16%),radial-gradient(circle at 70% 64%,#E8893A 0 17%,transparent 18%),#F4E6C0}
  .cell:hover:not(:disabled){transform:translateY(-2px)}
  .cell:focus-visible{outline:3px solid var(--red);outline-offset:2px}
  .cell:disabled{cursor:default}
  .cell[data-h]{border-color:var(--ink)}
  .cell[data-h="1"]{background:var(--red)}
  .cell[data-h="2"]{background:#FF9B3D}
  .cell[data-h="3"]{background:var(--y)}
  .cell[data-h="4"]{background:#CFE8FF}
  .cell[data-h="0"]{background:var(--truffle)}
  .cell[data-h="0"].gold{background:#FFD23F}
  .pin{position:absolute;left:0;top:0;pointer-events:none;z-index:3;filter:drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff) drop-shadow(0 2px 0 #fff) drop-shadow(0 -2px 0 #fff)}
  .fx{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
  .p{position:absolute;left:0;top:0;font-size:22px;line-height:1;will-change:transform,opacity}
  .p.dot{width:9px;height:9px;border-radius:50%}
  .p.conf{width:10px;height:14px;border-radius:2px}
  .dogbig.jump{animation:jump .7s cubic-bezier(.3,1.6,.5,1) 1}
  @keyframes jump{0%{translate:0 0}40%{translate:0 -38px;rotate:-14deg}70%{translate:0 0;rotate:8deg}100%{translate:0 0;rotate:0deg}}
  .cell.flip{animation:flip .4s cubic-bezier(.3,1.5,.5,1) 1}
  @keyframes flip{0%{transform:rotateY(90deg) scale(.8)}100%{transform:rotateY(0) scale(1)}}
  .cell.invite{animation:bob .5s ease-out 1 both}
  @keyframes bob{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
  .bubble.pop,.challenge.pop{animation:pop .3s cubic-bezier(.3,1.6,.5,1) 1}
  @keyframes pop{0%{transform:scale(.92)}100%{transform:scale(1)}}
  .tag.pop{animation:tagpop .35s cubic-bezier(.3,1.8,.5,1) 1}
  @keyframes tagpop{0%{scale:1.35}100%{scale:1}}
  #result.show{animation:rise .6s cubic-bezier(.2,1.3,.4,1) 1}
  @keyframes rise{0%{transform:translateY(60px);opacity:0}100%{transform:none;opacity:1}}
  @media (prefers-reduced-motion:reduce){.dogbig.jump,.cell.flip,.cell.invite,.bubble.pop,.challenge.pop,.tag.pop,#result.show{animation:none}}
  .trail{font-size:22px;letter-spacing:3px;min-height:28px;text-align:center}
  .panel{background:var(--paper);border:3px solid var(--ink);border-radius:20px;box-shadow:5px 5px 0 var(--ink);padding:14px;display:flex;flex-direction:column;gap:12px}
  .panel h2{margin:0;font:900 17px Unbounded,sans-serif;text-transform:uppercase}
  .vs{font:800 16px/1.3 Rubik,sans-serif;text-align:center;background:var(--y);border:3px solid var(--ink);border-radius:14px;padding:10px}
  .panel img{width:100%;border-radius:12px;border:2px solid var(--ink);display:block}
  .hint{font-size:13px;color:var(--muted);text-align:center;margin:-4px 0 0}
  .name{font:600 16px Rubik,sans-serif;border:3px solid var(--ink);border-radius:12px;padding:11px 12px;width:100%;background:#FFFBEA;color:var(--ink)}
  .name:focus-visible{outline:3px solid var(--red);outline-offset:2px}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
  .stats b{display:block;font:900 24px Unbounded,sans-serif}
  .stats span{font:600 11.5px/1.2 Rubik,sans-serif;color:var(--muted)}
  .dist{display:flex;flex-direction:column;gap:4px}
  .bar{display:flex;align-items:center;gap:6px;font:700 13px Rubik,sans-serif}
  .bar i{font-style:normal;width:18px;text-align:right}
  .bar div{background:#E9E2D2;border-radius:6px;height:20px;display:flex;align-items:center;justify-content:flex-end;padding:0 6px;min-width:26px;color:var(--ink)}
  .bar.me div{background:var(--red);color:#fff}
  .btn{display:block;width:100%;text-align:center;text-decoration:none;font:800 16px Rubik,sans-serif;border-radius:14px;padding:14px 16px;cursor:pointer;border:3px solid var(--ink);background:var(--red);color:#fff;box-shadow:4px 4px 0 var(--ink)}
  .btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
  .btn.ghost{background:var(--paper);color:var(--ink)}
  .btn:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
  .next{text-align:center;font:700 14px Rubik,sans-serif}
  .test{font-size:13px;color:var(--muted);text-align:center}
  .test button{font:700 13px Rubik,sans-serif;background:none;border:0;color:var(--ink);text-decoration:underline;cursor:pointer;padding:6px}
  footer{text-align:center;font:700 13px Rubik,sans-serif;margin-top:4px}
  /* Персонаж: части крутятся вокруг своих «суставов» в координатах рисунка */
  .dogsvg{display:block;overflow:visible}
  .dogsvg *{transform-box:view-box}
  .dogsvg .all{transform-origin:100px 148px}
  .dogsvg .tail{transform-origin:64px 82px;animation:dwag .9s ease-in-out infinite alternate}
  .dogsvg .head{transform-origin:132px 86px}
  .dogsvg .ear{transform-origin:141px 46px}
  .dogsvg .nose{transform-origin:194px 66px}
  .dogsvg .eyeo{transform-origin:161px 55px;animation:dblink 4.2s infinite}
  .dogsvg .lbf{transform-origin:75px 100px}.dogsvg .lff{transform-origin:127px 100px}
  .dogsvg .lbn{transform-origin:64px 104px}.dogsvg .lfn{transform-origin:137px 104px}
  @keyframes dwag{from{transform:rotate(-16deg)}to{transform:rotate(14deg)}}
  @keyframes dblink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
  @keyframes dbreath{0%,100%{transform:scale(1,1)}50%{transform:scale(1.015,.985)}}
  @keyframes dsniff{0%,100%{transform:rotate(0)}25%{transform:rotate(10deg)}50%{transform:rotate(3deg)}75%{transform:rotate(10deg)}}
  @keyframes dtwitch{0%,100%{transform:scale(1)}50%{transform:scale(1.25,.85)}}
  @keyframes drun{from{transform:rotate(30deg)}to{transform:rotate(-30deg)}}
  @keyframes ddig{from{transform:rotate(-55deg)}to{transform:rotate(15deg)}}
  @keyframes dear{from{transform:rotate(-6deg)}to{transform:rotate(14deg)}}
  @keyframes dhop{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px) rotate(-4deg)}}
  @keyframes dz{0%{transform:translate(0,6px);opacity:0}30%{opacity:1}100%{transform:translate(8px,-14px);opacity:0}}
  .dogsvg.idle .all{animation:dbreath 2.2s ease-in-out infinite}
  .dogsvg.sniff .head{animation:dsniff .5s ease-in-out infinite}
  .dogsvg.sniff .nose{animation:dtwitch .18s ease-in-out infinite}
  .dogsvg.sniff .tail,.dogsvg.run .tail,.dogsvg.dig .tail{animation-duration:.25s}
  .dogsvg.run .lbn,.dogsvg.run .lff{animation:drun .2s ease-in-out infinite alternate}
  .dogsvg.run .lbf,.dogsvg.run .lfn{animation:drun .2s ease-in-out infinite alternate-reverse}
  .dogsvg.run .ear{animation:dear .2s ease-in-out infinite alternate}
  .dogsvg.dig .all{transform:rotate(14deg)}
  .dogsvg.dig .head{transform:rotate(16deg)}
  .dogsvg.dig .lfn{animation:ddig .13s ease-in-out infinite alternate}
  .dogsvg.dig .lff{animation:ddig .13s ease-in-out infinite alternate-reverse}
  .dogsvg.happy .all{animation:dhop .45s ease-in-out infinite}
  .dogsvg.happy .tail{animation-duration:.14s}
  .dogsvg.happy .head{transform:rotate(-8deg)}
  .dogsvg.happy .ear{animation:dear .25s ease-in-out infinite alternate}
  .dogsvg.happy .tongue{display:inline}
  .dogsvg.sleep .all{transform:translateY(8px)}
  .dogsvg.sleep .head{transform:rotate(20deg)}
  .dogsvg.sleep .tail{animation:none;transform:rotate(18deg)}
  .dogsvg.sleep .eyeo{display:none}
  .dogsvg.sleep .eyec,.dogsvg.sleep .zz{display:inline}
  .dogsvg.sleep .z1{animation:dz 2s ease-in-out infinite}
  .dogsvg.sleep .z2{animation:dz 2s ease-in-out 1s infinite}
  @media (prefers-reduced-motion:reduce){.dogsvg *{animation:none!important}}
</style>
</head>
<body>
<div class="fx" id="fx" aria-hidden="true"></div>
<div class="wrap">
  <span class="tag" id="tag">5 нюхов</span>
  <span class="eyebrow">Стардогс в Париже · <span id="date"></span></span>
  <h1 class="logo">Трюфельная<br><span>собака</span></h1>

  <div class="challenge" id="challenge" hidden></div>

  <div class="hero">
    <div class="dogbig" id="dogbig" aria-hidden="true"></div>
    <div class="bubble" id="bubble" aria-live="polite"></div>
  </div>

  <div class="chips" aria-label="Подсказки">
    <span class="chip" style="background:var(--red);color:#fff">🔥 1 шаг</span><span class="chip" style="background:#FF9B3D">🌡 2 шага</span><span class="chip" style="background:var(--y)">🍂 3 шага</span><span class="chip" style="background:#CFE8FF">❄️ дальше</span>
    <button class="chip" id="soundBtn" type="button" aria-pressed="true">🔊</button>
  </div>

  <div class="scene">
    <svg class="sky" viewBox="0 0 340 62" aria-hidden="true">
      <g fill="#1E1A18">
        <path d="M0 62 V40 H14 V32 L22 26 L30 32 V36 H44 V62 Z"/><rect x="8" y="22" width="5" height="10"/>
        <path d="M48 62 V38 L56 30 H80 L88 38 V62 Z"/><rect x="60" y="22" width="4" height="9"/><rect x="72" y="24" width="4" height="7"/>
        <path d="M92 62 V44 H100 V36 H130 V44 H138 V62 Z"/><path d="M103 36 Q115 14 127 36 Z"/><rect x="113" y="8" width="4" height="12"/><path d="M96 44 Q100 34 104 44 Z M126 44 Q130 34 134 44 Z"/>
        <path d="M142 62 V42 L150 36 H176 L184 42 V62 Z"/><rect x="154" y="28" width="5" height="9"/>
        <path d="M188 62 V46 H214 V62 Z"/><path d="M190 46 L201 38 L212 46 Z"/>
        <path d="M241 62 L251 40 L256 22 L259 6 H262 L265 22 L270 40 L280 62 H272 Q260 48 249 62 Z"/><rect x="249" y="38" width="23" height="4"/><rect x="254" y="20" width="13" height="3"/>
        <path d="M284 62 V40 L292 34 H316 L324 40 V62 Z"/><rect x="296" y="26" width="5" height="9"/><path d="M326 62 V46 H340 V62 Z"/>
      </g>
      <rect x="259" y="0" width="3" height="3" fill="#2B3E8F"/><rect x="262" y="0" width="3" height="3" fill="#fff"/><rect x="265" y="0" width="3" height="3" fill="#D8262D"/>
    </svg>
    <div class="board" id="board" role="grid" aria-label="Поле 7 на 7">
      <div class="pin" id="pin" aria-hidden="true" hidden></div>
    </div>
  </div>

  <div class="trail" id="trail" aria-label="Ход игры"></div>

  <section id="result" hidden style="display:flex;flex-direction:column;gap:14px">
    <div class="vs" id="vs" hidden></div>
    <div class="panel">
      <img id="cardImg" alt="Карточка результата">
      <p class="hint">Зажми картинку, чтобы сохранить и кинуть в сторис</p>
      <input class="name" id="nameIn" maxlength="20" autocomplete="given-name" placeholder="Твоё имя для вызова (необязательно)" aria-label="Имя для вызова другу">
      <button class="btn" id="shareBtn" type="button">Бросить вызов другу</button>
    </div>
    <div class="panel">
      <h2>Твоя статистика</h2>
      <div class="stats">
        <div><b id="stPlayed">0</b><span>сыграно</span></div>
        <div><b id="stWin">0%</b><span>нашёл(ла)</span></div>
        <div><b id="stStreak">0</b><span>серия 🔥</span></div>
        <div><b id="stBest">0</b><span>рекорд серии</span></div>
      </div>
      <div class="dist" id="dist"></div>
      <p class="next" id="next"></p>
    </div>
    <a class="btn ghost" id="vkBtn" href="https://vk.com/stardogsrussia" target="_blank" rel="noopener">Подписаться на Стардогс в VK</a>
  </section>

  <div class="test" id="testBox" hidden>Тестовый режим · <button type="button" id="againBtn">спрятать трюфель заново</button></div>

  <footer>Трюфельное меню — уже в Стардогс 🥐</footer>
</div>

<script>
(function(){
  // Персонаж: трюфельная собака в берете и шарфе. Смотрит вправо. Позы — классом на <svg>: idle, sniff, run, dig, happy, sleep
  function dogSVG(pose){
    var happy=pose==="happy",sleep=pose==="sleep";
    return '<svg class="dogsvg '+pose+'" viewBox="0 0 210 160" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">'+
    '<g class="all" stroke="#1E1A18" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">'+
      '<g class="leg lbf"><rect x="68" y="98" width="15" height="46" rx="7.5" fill="#B97838"/></g>'+
      '<g class="leg lff"><rect x="120" y="98" width="15" height="46" rx="7.5" fill="#B97838"/></g>'+
      '<g class="tail"><path d="M60 86 C42 80 30 60 37 42 C40 35 49 37 48 45 C46 58 53 70 68 76 Z" fill="#E3A35F"/></g>'+
      '<ellipse cx="99" cy="95" rx="50" ry="28" fill="#E3A35F"/>'+
      '<path d="M74 111 Q100 124 128 111" fill="none" stroke-width="3.5" opacity=".35"/>'+
      '<g class="leg lbn"><rect x="56" y="102" width="17" height="46" rx="8.5" fill="#E3A35F"/></g>'+
      '<g class="leg lfn"><rect x="129" y="102" width="17" height="46" rx="8.5" fill="#E3A35F"/></g>'+
      '<g class="head">'+
        '<path d="M114 80 Q132 96 150 86 L155 99 Q134 113 110 93 Z" fill="#2B3E8F"/>'+
        '<path d="M121 97 L112 120 L125 117 L130 101 Z" fill="#2B3E8F"/>'+
        '<g transform="translate(152 66) scale(1.16) translate(-152 -66)">'+
        '<ellipse cx="152" cy="62" rx="27" ry="25" fill="#E3A35F"/>'+
        '<ellipse cx="177" cy="72" rx="20" ry="13.5" fill="#FFF3DC"/>'+
        '<path class="tongue" display="'+(happy?"inline":"none")+'" d="M171 81 Q172 97 181 95 Q186 92 182 81 Z" fill="#F07A93"/>'+
        '<path d="M166 80 Q177 87 190 79" fill="none" stroke-width="4"/>'+
        '<ellipse class="nose" cx="194" cy="66" rx="7.5" ry="6" fill="#1E1A18"/>'+
        '<g class="eyeo" display="'+(sleep?"none":"inline")+'"><ellipse cx="161" cy="55" rx="4.8" ry="5.6" fill="#1E1A18" stroke="none"/><circle cx="162.8" cy="53" r="1.7" fill="#fff" stroke="none"/></g>'+
        '<path class="eyec" display="'+(sleep?"inline":"none")+'" d="M155 56 Q161 61 167 56" fill="none" stroke-width="4"/>'+
        '<ellipse cx="170" cy="63" rx="5" ry="3" fill="#F07A93" stroke="none" opacity=".55"/>'+
        '<g class="ear"><path d="M137 44 Q124 54 127 78 Q131 87 140 79 Q148 62 147 46 Z" fill="#9A5F2A"/></g>'+
        '<g class="beret"><path d="M128 43 Q148 20 178 37 Q170 47 148 47 Q134 47 128 43 Z" fill="#D8262D"/><path d="M152 29 L155 21" stroke-width="5"/></g>'+
      '</g>'+
      '</g>'+
      '<g class="zz" display="'+(sleep?"inline":"none")+'" stroke="none" fill="#1E1A18" font-family="Rubik,sans-serif" font-weight="800"><text class="z1" x="182" y="36" font-size="20">z</text><text class="z2" x="194" y="20" font-size="15">z</text></g>'+
    '</g></svg>';
  }
  function dogPose(el,pose){var s=el.querySelector("svg");if(s)s.setAttribute("class","dogsvg "+pose)}

  // Яндекс Метрика: вписать номер счётчика — начнут считаться цели start / found / lost / share / vk / challenge
  var METRIKA_ID=null;

  // Сложность подобрана симуляцией 28.09: поле 7×7, 5 нюхов, шаги без диагоналей — внимательный игрок проигрывает ~8%, обычный ~30%
  var N=7, MAX=5;
  var HEAT=[null,
    {e:"🔥",t:"ГОРИТ! Трюфель в шаге",s:"Он прям рядом — жми по соседству",snd:"hot"},
    {e:"🌡",t:"Тепло. Чую вайб трюфеля",s:"До него два шага",snd:"warm"},
    {e:"🍂",t:"Мимо. Тут одни листья",s:"Три шага — ищи в другой стороне",snd:"miss"},
    {e:"❄️",t:"Холодно. Даже не близко",s:"Трюфель где-то далеко",snd:"cold"}];
  var CARDS=[null,
    {name:"Легенда Перигора",e:"👑",line:"С первого нюха. Это читы или талант?"},
    {name:"Такса-сомелье",e:"🍷",line:"Нос уровня бог. Трюфель даже не успел спрятаться"},
    {name:"Пудель с Монмартра",e:"🥐",line:"Чилл, круассан, трюфель. Всё по вайбу"},
    {name:"Шпиц-турист",e:"📸",line:"Сто фоток у Эйфелевой — и всё равно нашёл"},

    x.font="800 40px Rubik, sans-serif";x.fillStyle="#1E1A18";x.fillText("Я —",W/2-8,1180);
    var fs=72;do{x.font="900 "+fs+"px Unbounded, sans-serif";fs-=2}while(x.measureText(c.name).width>760&&fs>30);x.fillStyle="#D8262D";x.fillText(c.name,W/2-8,1270);x.font="80px serif";x.fillText(c.e,W/2-8,1360);
    x.font="500 40px Rubik, sans-serif";x.fillStyle="#1E1A18";wrap(x,c.line,W/2-8,1450,740,52);
    if(s.streak>1){x.font="800 42px Rubik, sans-serif";x.fillStyle="#D8262D";x.fillText("🔥 Серия: "+s.streak+" дн. подряд",W/2-8,1585)}
    x.save();x.translate(W/2,1760);x.rotate(.04);rr(x,-370,-60,740,120,60);x.fillStyle="#1E1A18";x.fill();x.fillStyle="#fff";x.font="800 44px Rubik, sans-serif";x.textBaseline="middle";x.fillText("А ты кто? Найди свой трюфель",0,2);x.restore();
    var img=document.getElementById("cardImg"),im=new Image();
    im.onload=function(){x.drawImage(im,W/2-190,605,380,290);img.src=cv.toDataURL("image/png")};
    im.onerror=function(){img.src=cv.toDataURL("image/png")};
    im.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(dogSVG(state.found?"happy":"sleep"));
  }
  document.getElementById("shareBtn").addEventListener("click",function(){
    var btn=this,t=shareText(lastStats||stats()),u=shareUrl();goal("share");
    if(navigator.share){navigator.share({text:t,url:u}).catch(function(){});return}
    function ok(){btn.textContent="Скопировано — вставь другу в чат";setTimeout(function(){btn.textContent="Бросить вызов другу"},2500)}
    try{navigator.clipboard.writeText(t+"\n"+u).then(ok,function(){prompt("Скопируй и отправь другу:",t+" "+u)})}catch(e){prompt("Скопируй и отправь другу:",t+" "+u)}
  });
  document.getElementById("vkBtn").addEventListener("click",function(){goal("vk")});
  document.getElementById("againBtn").addEventListener("click",function(){newGame("test"+Math.random())});

  var SKEY="td2-"+dayKey;
  function save(){if(!TEST)store(SKEY,JSON.stringify(state))}
  var saved=null;if(!TEST){try{saved=JSON.parse(store(SKEY))}catch(e){}}
  if(saved&&saved.tries){
    state=saved;render();
    if(state.tries.length&&!state.done){placePin(state.tries[state.tries.length-1]);say("С возвращением 🐕","Нюхай дальше — трюфель ещё тут")}
    if(state.done){say(state.found?"Сегодняшний трюфель уже твой 🟤":"Сегодня уже нюхали 😴","Возвращайся завтра — спрячем новый");if(state.tries.length)placePin(state.tries[state.tries.length-1]);dogPose(big,state.found?"happy":"sleep");dogPose(pin,state.found?"happy":"sleep");finish()}
  }else newGame(dayKey);
  if(document.fonts&&document.fonts.load)Promise.all([document.fonts.load("900 96px Unbounded"),document.fonts.load("800 40px Rubik"),document.fonts.load("500 40px Rubik")]).then(function(){if(state.done)drawCard(lastStats||stats())});
  addEventListener("resize",function(){if(state.tries.length&&!busy)placePin(state.tries[state.tries.length-1])});
  // приглашающая «волна» по клеткам + фиксированная высота облачка, чтобы поле не прыгало под пальцем
  if(!state.tries.length&&!RM)cells.forEach(function(c,i){c.style.animationDelay=(Math.floor(i/N)+i%N)*35+"ms";c.classList.add("invite");c.addEventListener("animationend",function(){c.classList.remove("invite");c.style.animationDelay=""},{once:true})});
  function fixBubble(){if(!state.tries.length){bubble.style.minHeight="";bubble.style.minHeight=bubble.offsetHeight+"px"}}
  fixBubble();if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fixBubble);
})();
